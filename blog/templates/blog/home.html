<!DOCTYPE html>
<html>
<head>
    <title>Мой блог</title>
</head>
<body>
    <h1>Мои статьи</h1>
    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <small>Опубликовано: {{ post.date_posted }}</small>
        </div>
    {% empty %}
        <p>Статей пока нет.</p>
    {% endfor %}
</body>
</html>
