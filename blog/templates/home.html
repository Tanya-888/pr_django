<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Главная страница</title>
</head>
<body>
    <h1>Последние посты</h1>
    {% if posts %}
        <ul>
        {% for post in posts %}
            <li>
                <h2>{{ post.title }}</h2>
                <p><em>Автор: {{ post.author.username }}</em></p>
                <p>Дата: {{ post.created_at|date:"d.m.Y H:i" }}</p>
                <p>{{ post.content }}</p>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Посты отсутствуют.</p>
    {% endif %}
</body>
</html>
